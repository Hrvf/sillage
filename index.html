<title>Sillages de Hraf</title>
<style>
/* Layout: grammaire iOS (onglets en bas, listes groupées, feuilles, grands titres repliables) + identité parfum : New York pour les noms, ambre comme accent, pochettes olfactives générées, flacon du jour plein cadre */
:root{
  --bg:#F6F4F1; --cell:#FFFFFF; --label:#141210; --label2:rgba(60,56,52,.62);
  --sep:rgba(60,56,52,.16); --fill:rgba(120,112,104,.13); --bar:rgba(248,246,243,.84);
  --accent:#9A5B13; --accent-soft:rgba(186,120,40,.13); --warn:#D13A2F; --warn-soft:rgba(209,58,47,.1); --ok:#2E8B57;
  --sheet:#FFFFFF; --on-art:#FFFFFF;
  --ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --serif:ui-serif, "New York", "Iowan Old Style", "Palatino", Georgia, serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --label:#F5F2EE; --label2:rgba(235,230,224,.6);
  --sep:rgba(84,80,76,.6); --fill:rgba(118,114,110,.24); --bar:rgba(18,18,18,.82);
  --accent:#E7A64A; --accent-soft:rgba(231,166,74,.16); --warn:#FF6B5E; --warn-soft:rgba(255,107,94,.14); --ok:#4CC38A;
  --sheet:#1C1C1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --label:#F5F2EE; --label2:rgba(235,230,224,.6);
  --sep:rgba(84,80,76,.6); --fill:rgba(118,114,110,.24); --bar:rgba(18,18,18,.82);
  --accent:#E7A64A; --accent-soft:rgba(231,166,74,.16); --warn:#FF6B5E; --warn-soft:rgba(255,107,94,.14); --ok:#4CC38A;
  --sheet:#1C1C1E; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--label);font-family:var(--ui);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.view{max-width:760px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:10px calc(100px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:8px;margin:6px 0 4px;font-family:var(--serif);font-weight:700;font-size:17px}
.brand img{border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.eyebrow{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.03em;margin:8px 0 0}
.large{font-family:var(--serif);font-size:36px;font-weight:700;letter-spacing:-.005em;margin:0 0 14px;line-height:1.1}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px;gap:12px}
.sec h2{font-family:var(--serif);font-size:22px;font-weight:700;margin:0}
.sec span{font-size:14px;color:var(--label2)}

/* ===== pochettes olfactives ===== */
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const W=420;
const MOTIF={
 rings(x,r,a){const cx=W*(.25+.5*r()),cy=W*(.25+.5*r());for(let i=1;i<16;i++){x.beginPath();x.arc(cx,cy,i*W*.055,0,7);x.strokeStyle=`rgba(255,255,255,${a*(.5-i*.028)})`;x.lineWidth=1+r()*2.4;x.stroke();}},
 petals(x,r,a){for(let f=0;f<3;f++){const cx=W*(.15+.7*r()),cy=W*(.15+.7*r()),R=W*(.12+.14*r()),n=5+Math.floor(r()*3),rot=r()*6;x.save();x.translate(cx,cy);for(let k=0;k<n;k++){x.save();x.rotate(rot+k*Math.PI*2/n);x.beginPath();x.ellipse(R*.55,0,R*.55,R*.23,0,0,7);x.fillStyle=`rgba(255,255,255,${a*.16})`;x.fill();x.strokeStyle=`rgba(255,255,255,${a*.4})`;x.lineWidth=1.4;x.stroke();x.restore();}x.beginPath();x.arc(0,0,R*.12,0,7);x.fillStyle=`rgba(255,255,255,${a*.45})`;x.fill();x.restore();}},
 smoke(x,r,a){x.save();x.shadowColor="rgba(255,255,255,.45)";x.shadowBlur=18;for(let k=0;k<7;k++){let px=W*(.1+.8*r()),py=W*1.05;x.beginPath();x.moveTo(px,py);for(let s=0;s<4;s++){const nx=px+(r()-.5)*W*.5,ny=py-W*(.22+r()*.1);x.bezierCurveTo(px+(r()-.5)*W*.4,py-W*.1,nx+(r()-.5)*W*.4,ny+W*.1,nx,ny);px=nx;py=ny;}x.strokeStyle=`rgba(255,255,255,${a*(.18+r()*.18)})`;x.lineWidth=2+r()*7;x.stroke();}x.restore();},
 waves(x,r,a){const f=1+r()*1.5,ph=r()*6;for(let k=0;k<15;k++){const y0=W*(.06+k*.065);x.beginPath();for(let px=0;px<=W;px+=6){const y=y0+Math.sin(px/W*Math.PI*2*f+ph+k*.45)*W*.03;px?x.lineTo(px,y):x.moveTo(px,y);}x.strokeStyle=`rgba(255,255,255,${a*(.15+.25*(k%3===0))})`;x.lineWidth=k%3===0?2.6:1.3;x.stroke();}},
 grain(x,r,a){for(let i=0;i<520;i++){const px=r()*W,py=r()*W,l=5+r()*12,an=-.7+(r()-.5)*.5;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(an)*l,py+Math.sin(an)*l);x.strokeStyle=`rgba(255,255,255,${a*(.07+r()*.12)})`;x.lineWidth=1;x.stroke();}for(let i=0;i<5;i++){x.beginPath();const y=W*(.1+r()*.8);x.moveTo(0,y);x.quadraticCurveTo(W*.5,y+(r()-.5)*W*.3,W,y+(r()-.5)*W*.2);x.strokeStyle=`rgba(255,255,255,${a*.22})`;x.setLineDash([3,6]);x.lineWidth=1.6;x.stroke();x.setLineDash([]);}},
 dots(x,r,a){for(let i=0;i<30;i++){const R=W*(.01+Math.pow(r(),2.2)*.09);x.beginPath();x.arc(r()*W,r()*W,R,0,7);x.fillStyle=`rgba(255,255,255,${a*(.08+r()*.16)})`;x.fill();if(R>W*.04){x.strokeStyle=`rgba(255,255,255,${a*.35})`;x.lineWidth=1.2;x.stroke();}}}
};
const artCache=new Map();
function artURL(a,b){
  const key=a+"|"+(b||"");if(artCache.has(key))return artCache.get(key);
  let url="";
  try{
    const cv=document.createElement("canvas");cv.width=cv.height=W;const x=cv.getContext("2d");
    const ca=P[a].c,cb=b?P[b].c:ca;
    const g=x.createLinearGradient(0,0,W,W);g.addColorStop(0,ca[0]);g.addColorStop(.46,ca[1]);g.addColorStop(.54,b?cb[1]:ca[1]);g.addColorStop(1,b?cb[0]:ca[0]);
    x.fillStyle=g;x.fillRect(0,0,W,W);
    const r=rng(hash(key));
    MOTIF[P[a].m](x,r,1);
    if(b)MOTIF[P[b].m](x,r,.7);
    const v=x.createRadialGradient(W*.3,W*.25,W*.05,W*.5,W*.5,W*.8);v.addColorStop(0,"rgba(255,255,255,.14)");v.addColorStop(1,"rgba(0,0,0,.18)");x.fillStyle=v;x.fillRect(0,0,W,W);
    for(let i=0;i<1400;i++){x.fillStyle=`rgba(255,255,255,${r()*.05})`;x.fillRect(r()*W,r()*W,1,1);}
    url=cv.toDataURL("image/jpeg",.86);
  }catch(e){url="";}
  artCache.set(key,url);return url;
}
function artBg(a,b){const u=artURL(a,b);const ca=P[a].c,cb=b?P[b].c:ca;return u?`background-image:url(${u})`:`background:linear-gradient(135deg,${ca[0]},${cb[1]})`;}

/* ===== dosage, zones, sillage ===== */
function target(c){return [...c.dose.matchAll(/<b>(\d+)/g)].reduce((s,m)=>s+ +m[1],0)||2;}
function zones(c){const d=c.dose;const z=[];if(/cou/.test(d))z.push("cou");if(/torse/.test(d))z.push("torse");if(/vêtements|t-shirt/.test(d))z.push("vêt");return z.length?z:["cou"];}
function level(c){const m=Math.max(P[c.a].pow,c.b?P[c.b].pow:0);return m<=3?1:m===4?2:3;}
const LV=["Proche de la peau","À un bras","Toute la pièce"];
const ZN={cou:"cou",torse:"torse",vêt:"vêtements"};
function silSVG(c){
  const lv=level(c),z=zones(c);
  const ring=i=>`<circle cx="70" cy="70" r="${30+i*16}" fill="none" stroke="${i<lv?"var(--accent)":"var(--sep)"}" stroke-width="${i<lv?2:1.2}" ${i<lv?"":'stroke-dasharray="3 4"'} opacity="${i<lv?1-i*.22:1}"/>`;
  const dot=(on,x,y)=>on?`<circle cx="${x}" cy="${y}" r="5" fill="var(--accent)" stroke="var(--cell)" stroke-width="2"/>`:"";
  return `<svg viewBox="0 0 140 120" aria-hidden="true">${[2,1,0].map(ring).join("")}
    <circle cx="70" cy="46" r="12" fill="var(--label2)" opacity=".35"/>
    <path d="M44 120 C44 82 54 66 70 64 C86 66 96 82 96 120 Z" fill="var(--label2)" opacity=".35"/>
    ${dot(z.includes("cou"),70,64)}${dot(z.includes("torse"),70,86)}${z.includes("vêt")?`<rect x="81" y="94" width="10" height="10" rx="2" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="86" cy="99" r="2.6" fill="var(--accent)"/>`:""}
  </svg>`;
}
function silBlock(c){return `<div class="sil">${silSVG(c)}<div><p class="k" style="margin:0">Sillage</p><p class="lv">${LV[level(c)-1]}</p><p class="zn">Sur : ${zones(c).map(z=>ZN[z]).join(", ")}</p></div></div>`;}

/* ===== semaine ===== */
function recentWorn(days=6){const lim=new Date();lim.setDate(lim.getDate()-days);const k=dkey(lim);return new Set(S.worn.filter(w=>w.d>=k&&w.d!==dkey()).map(w=>w.id));}
function candidates(o,w){let l=C.filter(c=>c.occ.includes(o)&&c.wx.includes(w));return l.length?l:C.filter(c=>c.occ.includes(o));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickFor(i,used){
  const recent=recentWorn();const pool=candidates(S.occ[i],S.wx);
  const fresh=pool.filter(c=>!recent.has(c.id));const base=fresh.length?fresh:pool;
  const ord=[...shuffle(base.filter(c=>c.kind!=="solo")),...shuffle(base.filter(c=>c.kind==="solo"))];
  const p=ord.find(c=>!used.has(c.id))||ord[0];return p?p.id:null;
}
function generate(){const used=new Set();S.picks=S.occ.map((_,i)=>{const id=pickFor(i,used);used.add(id);return id;});save();renderWeek();}
function change(i){
  const pool=candidates(S.occ[i],S.wx);const used=new Set(S.picks.filter((_,j)=>j!==i));
  const cur=pool.findIndex(c=>c.id===S.picks[i]);
  for(let s=1;s<=pool.length;s++){const c=pool[(cur+s)%pool.length];if(!used.has(c.id)||s===pool.length){S.picks[i]=c.id;break;}}
  save();renderWeek();
}
const isWornToday=id=>S.worn.some(w=>w.d===dkey()&&w.id===id);
function sprayState(id){const n=(S.spray&&S.spray.d===dkey()&&S.spray.id===id)?S.spray.n:0;return n;}
function sprayLabel(c){const n=sprayState(c.id),t=target(c);
  if(n===0)return {cls:"spray",txt:"Maintiens pour vaporiser",sub:`0 sur ${t}`};
  if(n<t)return {cls:"spray",txt:"Encore",sub:`${n} sur ${t}`};
  if(n===t)return {cls:"done",txt:"Dose atteinte",sub:`${n} sur ${t}`};
  return {cls:"over",txt:"C'est assez",sub:`${n} sur ${t}`};}

let holdT=null;
function mist(){

function doSpray(){
  const c=byId(S.picks[todayIdx()]);if(!c)return;
  const n=sprayState(c.id)+1;S.spray={d:dkey(),id:c.id,n};save();mist();
  const b=document.getElementById("sprayBtn"),sl=sprayLabel(c);

  const b=document.getElementById("sprayBtn");if(!b)return;

  b.addEventListener("pointerdown",start);["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,stop));

function drawFlask(x,s){
  const g=x.createLinearGradient(0,0,s,s);g.addColorStop(0,"#2A1A12");g.addColorStop(1,"#0E0A08");
  x.fillStyle=g;x.fillRect(0,0,s,s);
  const u=s/100;x.lineJoin="round";x.lineCap="round";
  const flask=()=>{x.beginPath();x.moveTo(40*u,18*u);x.lineTo(40*u,40*u);x.lineTo(20*u,76*u);x.quadraticCurveTo(16*u,84*u,25*u,84*u);x.lineTo(75*u,84*u);x.quadraticCurveTo(84*u,84*u,80*u,76*u);x.lineTo(60*u,40*u);x.lineTo(60*u,18*u);};
  x.save();flask();x.clip();
  const lq=x.createLinearGradient(0,52*u,0,84*u);lq.addColorStop(0,"#F3C26B");lq.addColorStop(1,"#B5651D");
  x.fillStyle=lq;x.beginPath();x.moveTo(0,56*u);x.quadraticCurveTo(25*u,52*u,50*u,56*u);x.quadraticCurveTo(75*u,60*u,100*u,55*u);x.lineTo(100*u,100*u);x.lineTo(0,100*u);x.fill();
  x.fillStyle="rgba(255,255,255,.55)";[[42,72,3.2],[55,66,2.2],[48,62,1.6],[60,76,2.6]].forEach(([a,b,r])=>{x.beginPath();x.arc(a*u,b*u,r*u,0,7);x.fill();});
  x.restore();
  flask();x.strokeStyle="rgba(255,255,255,.92)";x.lineWidth=4*u;x.stroke();
  x.beginPath();x.moveTo(35*u,18*u);x.lineTo(65*u,18*u);x.stroke();
  x.fillStyle="rgba(243,194,107,.85)";[[46,10,2.4],[54,5,1.6],[58,12,1.3]].forEach(([a,b,r])=>{x.beginPath();x.arc(a*u,b*u,r*u,0,7);x.fill();});
}
const LOGO=(()=>{try{const cv=document.createElement("canvas");cv.width=cv.height=120;drawFlask(cv.getContext("2d"),120);return `<img src="${cv.toDataURL("image/png")}" alt="" width="30" height="30">`;}catch(e){return "";}})();
try{
  const cv=document.createElement("canvas");cv.width=cv.height=180;drawFlask(cv.getContext("2d"),180);
  const url=cv.toDataURL("image/png");
  [["apple-touch-icon"],["icon"]].forEach(([rel])=>{const l=document.createElement("link");l.rel=rel;l.href=url;l.sizes="180x180";document.head.appendChild(l);});
}catch(e){}

/* ===== démarrage ===== */
if(!S.picks||S.picks.length!==7||S.picks.some(id=>id&&!byId(id))) generate();
else if(S.picks.some(id=>!id)){S.picks=S.picks.map((id,i)=>id||pickFor(i,new Set(S.picks)));save();}
renderWeek();renderCombos();renderPerfumes();renderAvoid();
showTab(S.tab||"semaine");
</script>
