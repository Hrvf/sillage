<title>Sillages de Hraf</title>
<style>
/* Layout: grammaire iOS (onglets en bas, listes groupées, feuilles, grands titres repliables) + identité parfum : New York pour les noms, ambre comme accent, pochettes olfactives générées, flacon du jour plein cadre */
:root{
  --bg:#F6F4F1; --cell:#FFFFFF; --label:#141210; --label2:rgba(60,56,52,.62);
  --sep:rgba(60,56,52,.16); --fill:rgba(120,112,104,.13); --bar:rgba(248,246,243,.84);
  --accent:#9A5B13; --accent-soft:rgba(186,120,40,.13); --warn:#D13A2F; --warn-soft:rgba(209,58,47,.1); --ok:#2E8B57;
  --sheet:#FFFFFF; --on-art:#FFFFFF;
  --ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --serif:ui-serif, "New York", "Iowan Old Style", "Palatino", Georgia, serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --label:#F5F2EE; --label2:rgba(235,230,224,.6);
  --sep:rgba(84,80,76,.6); --fill:rgba(118,114,110,.24); --bar:rgba(18,18,18,.82);
  --accent:#E7A64A; --accent-soft:rgba(231,166,74,.16); --warn:#FF6B5E; --warn-soft:rgba(255,107,94,.14); --ok:#4CC38A;
  --sheet:#1C1C1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --label:#F5F2EE; --label2:rgba(235,230,224,.6);
  --sep:rgba(84,80,76,.6); --fill:rgba(118,114,110,.24); --bar:rgba(18,18,18,.82);
  --accent:#E7A64A; --accent-soft:rgba(231,166,74,.16); --warn:#FF6B5E; --warn-soft:rgba(255,107,94,.14); --ok:#4CC38A;
  --sheet:#1C1C1E; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--label);font-family:var(--ui);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.view{max-width:760px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:10px calc(100px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:8px;margin:6px 0 4px;font-family:var(--serif);font-weight:700;font-size:17px}
.brand img{border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.eyebrow{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.03em;margin:8px 0 0}
.large{font-family:var(--serif);font-size:36px;font-weight:700;letter-spacing:-.005em;margin:0 0 14px;line-height:1.1}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px;gap:12px}
.sec h2{font-family:var(--serif);font-size:22px;font-weight:700;margin:0}
.sec span{font-size:14px;color:var(--label2)}

  const ring=i=>`<circle cx="70" cy="70" r="${30+i*16}" fill="none" stroke="${i<lv?"var(--accent)":"var(--sep)"}" stroke-width="${i<lv?2:1.2}" ${i<lv?"":'stroke-dasharray="3 4"'} opacity="${i<lv?1-i*.22:1}"/>`;
  const dot=(on,x,y)=>on?`<circle cx="${x}" cy="${y}" r="5" fill="var(--accent)" stroke="var(--cell)" stroke-width="2"/>`:"";
  return `<svg viewBox="0 0 140 120" aria-hidden="true">${[2,1,0].map(ring).join("")}
    <circle cx="70" cy="46" r="12" fill="var(--label2)" opacity=".35"/>
    <path d="M44 120 C44 82 54 66 70 64 C86 66 96 82 96 120 Z" fill="var(--label2)" opacity=".35"/>
    ${dot(z.includes("cou"),70,64)}${dot(z.includes("torse"),70,86)}${z.includes("vêt")?`<rect x="81" y="94" width="10" height="10" rx="2" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="86" cy="99" r="2.6" fill="var(--accent)"/>`:""}
  </svg>`;
}
function silBlock(c){return `<div class="sil">${silSVG(c)}<div><p class="k" style="margin:0">Sillage</p><p class="lv">${LV[level(c)-1]}</p><p class="zn">Sur : ${zones(c).map(z=>ZN[z]).join(", ")}</p></div></div>`;}

function recentWorn(days=6){const lim=new Date();lim.setDate(lim.getDate()-days);const k=dkey(lim);return new Set(S.worn.filter(w=>w.d>=k&&w.d!==dkey()).map(w=>w.id));}
function candidates(o,w){let l=C.filter(c=>c.occ.includes(o)&&c.wx.includes(w));return l.length?l:C.filter(c=>c.occ.includes(o));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickFor(i,used){
  const recent=recentWorn();const pool=candidates(S.occ[i],S.wx);
  const fresh=pool.filter(c=>!recent.has(c.id));const base=fresh.length?fresh:pool;
  const ord=[...shuffle(base.filter(c=>c.kind!=="solo")),...shuffle(base.filter(c=>c.kind==="solo"))];
  const p=ord.find(c=>!used.has(c.id))||ord[0];return p?p.id:null;
}
function generate(){const used=new Set();S.picks=S.occ.map((_,i)=>{const id=pickFor(i,used);used.add(id);return id;});save();renderWeek();}
function change(i){
  const pool=candidates(S.occ[i],S.wx);const used=new Set(S.picks.filter((_,j)=>j!==i));
  const cur=pool.findIndex(c=>c.id===S.picks[i]);
  for(let s=1;s<=pool.length;s++){const c=pool[(cur+s)%pool.length];if(!used.has(c.id)||s===pool.length){S.picks[i]=c.id;break;}}
  save();renderWeek();
}
const isWornToday=id=>S.worn.some(w=>w.d===dkey()&&w.id===id);
function sprayState(id){const n=(S.spray&&S.spray.d===dkey()&&S.spray.id===id)?S.spray.n:0;return n;}
function sprayLabel(c){const n=sprayState(c.id),t=target(c);
  if(n===0)return {cls:"spray",txt:"Maintiens pour vaporiser",sub:`0 sur ${t}`};
  if(n<t)return {cls:"spray",txt:"Encore",sub:`${n} sur ${t}`};
  if(n===t)return {cls:"done",txt:"Dose atteinte",sub:`${n} sur ${t}`};
  return {cls:"over",txt:"C'est assez",sub:`${n} sur ${t}`};}

/* atomiseur */
let holdT=null;
function mist(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const m=document.getElementById("mist");if(!m)return;
  for(let i=0;i<16;i++){const p=document.createElement("i");
    p.style.setProperty("--dx",`${(Math.random()-.5)*130}px`);p.style.setProperty("--dy",`${-30-Math.random()*90}px`);p.style.setProperty("--s",(1.5+Math.random()*3.5).toFixed(2));
    p.style.animationDelay=`${Math.random()*.12}s`;m.appendChild(p);setTimeout(()=>p.remove(),1500);}
}
function doSpray(){
  const c=byId(S.picks[todayIdx()]);if(!c)return;
  const n=sprayState(c.id)+1;S.spray={d:dkey(),id:c.id,n};save();mist();
  const b=document.getElementById("sprayBtn"),sl=sprayLabel(c);
  b.className=`t-btn ${sl.cls}`;b.innerHTML=`${sl.txt}<small>${sl.sub}</small>`;
}
function bindSpray(){
  const b=document.getElementById("sprayBtn");if(!b)return;
  const start=e=>{e.preventDefault();b.classList.add("holding");holdT=setTimeout(()=>{b.classList.remove("holding");doSpray();},380);};
  const stop=()=>{b.classList.remove("holding");clearTimeout(holdT);};
  b.addEventListener("pointerdown",start);["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();doSpray();}});
  b.addEventListener("contextmenu",e=>e.preventDefault());
}
function toggleWorn(id){
  const k=dkey();const i=S.worn.findIndex(w=>w.d===k&&w.id===id);
  if(i>=0)S.worn.splice(i,1);else S.worn.push({d:k,id});
  S.worn=S.worn.slice(-120);save();
}

function renderCombosBody(){

  const row=c=>`<button class="row" data-choose="${c.id}">${thumb(c)}<div class="tx"><div class="r1">${label(c)}</div><div class="r2">${c.dose.replace(/<[^>]+>/g,"")}</div></div>${c.id===cur?'<span class="check">✓</span>':""}</button>`;
  const el=document.getElementById("pklist");if(!el)return;
  if(q){const hits=C.filter(c=>norm(label(c)).includes(q));el.innerHTML=hits.length?`<div class="list" style="background:var(--bg)">${hits.map(row).join("")}</div>`:`<p class="empty">Aucun résultat.</p>`;return;}
  const solos=C.filter(c=>c.kind==="solo"),lay=C.filter(c=>c.kind!=="solo");
  const forOcc=lay.filter(c=>c.occ.includes(occ));
  el.innerHTML=`<div class="sec" style="margin-top:14px"><h2 style="font-size:19px">Un seul parfum</h2></div><div class="list" style="background:var(--bg)">${solos.map(row).join("")}</div>
    ${forOcc.length?`<div class="sec"><h2 style="font-size:19px">Combos ${OCC[occ]}</h2></div><div class="list" style="background:var(--bg)">${forOcc.map(row).join("")}</div>`:""}
    <div class="sec"><h2 style="font-size:19px">Tous les combos</h2></div><div class="list" style="background:var(--bg)">${lay.filter(c=>!forOcc.includes(c)).map(row).join("")}</div>`;
}
function choose(id){
  const i=pickerDay;const old=S.picks[i];
  if(i===todayIdx()){const k=dkey();const w=S.worn.find(x=>x.d===k&&x.id===old);if(w)w.id=id;}
  S.picks[i]=id;save();renderWeek();renderCombosBodySafe();closeSheet();
}

/* ===== gestion de la collection ===== */
const clean=s=>String(s||"").replace(/[<>"]/g,"").trim();
const selv=id=>[...document.querySelectorAll("#"+id+" [aria-pressed=\"true\"]")].map(b=>b.dataset.v);
const ferr=m=>{const e=document.getElementById("fErr");if(e)e.textContent=m;};
function refreshPicks(){const used=new Set();S.picks=S.picks.map((id,i)=>{const ok=id&&byId(id)&&!used.has(id);const nid=ok?id:pickFor(i,used);used.add(nid);return nid;});save();}
function applyChange(){rebuild();refreshPicks();renderWeek();renderCombos();renderPerfumes();renderAvoid();}
function perfActions(k){
  const p=P[k];let h=`<div class="sec" style="margin-top:22px"><h2 style="font-size:19px">Ma collection</h2></div>`;
  if(isActive(k))h+=`<button class="btn ghost danger full" data-remove="${k}">Je ne l'ai plus</button><p class="foot">Le parfum et ses combos disparaissent de l'app. Tu pourras le remettre plus tard.</p>`;
  else h+=`<button class="btn full" data-restore="${k}">Remettre dans ma collection</button>`;
  if(p.custom)h+=`<button class="btn ghost danger full" style="margin-top:10px" data-delete="${k}">Supprimer définitivement</button>`;
  return h;
}
function renderPExtra(){
  const el=document.getElementById("pextra");if(!el)return;
  const rem=S.removed.filter(k=>P[k]);
  el.innerHTML=`${rem.length?`<div class="sec"><h2>Plus dans ma collection</h2></div><div class="list">${rem.map(k=>`<button class="row" data-perf="${k}">${pThumb(k)}<div class="tx"><div class="r1">${P[k].n}</div><div class="r2">Touche pour le remettre</div></div>${CHEV}</button>`).join("")}</div>`:""}
    <div class="sec"><h2>Sauvegarde</h2></div>
    <div class="list" style="padding:12px 14px">
      <p class="foot" style="margin:0 0 10px">Tes ajouts, ton historique et tes favoris restent sur ce téléphone. Copie ta sauvegarde pour les garder ou les transférer sur une autre version de l'app.</p>
      <div class="btnrow" style="margin:0"><button class="btn ghost" id="bkCopy">Copier</button><button class="btn ghost" id="bkImport">Importer</button></div>
      <textarea class="inp" id="bkText" rows="3" placeholder="Colle ici une sauvegarde, puis touche Importer"></textarea>
      <p class="foot" id="bkMsg" style="margin:6px 0 0"></p>
    </div>`;
}
function openAddPerf(){
  openSheet(`<h3 class="ftitle">Ajouter un parfum</h3>
    <div class="field"><label for="fN">Nom</label><input id="fN" class="inp" maxlength="40" placeholder="ex : Baccarat Rouge 540" autocomplete="off"></div>
    <div class="field"><label for="fH">Maison</label><input id="fH" class="inp" maxlength="40" placeholder="ex : Maison Francis Kurkdjian" autocomplete="off"></div>
    <div class="field"><span class="flabel">Famille</span><div class="chips pick1" id="fFam">${Object.entries(FAM).map(([k,f],i)=>`<button class="chipt" data-v="${k}" aria-pressed="${i===0}">${f.l}</button>`).join("")}</div></div>
    <div class="field"><span class="flabel">Puissance</span><div class="seg pick1" id="fPow">${[1,2,3,4,5].map(n=>`<button data-v="${n}" aria-pressed="${n===3}">${n}</button>`).join("")}</div><p class="foot" style="margin:6px 0 0">1 : très discret · 3 : moyen · 5 : remplit une pièce</p></div>
    <div class="field"><label for="fNotes">Notes principales</label><input id="fNotes" class="inp" placeholder="ex : safran, jasmin, ambre, cèdre" autocomplete="off"></div>
    <div class="field"><span class="flabel">Quand le porter</span><div class="chips" id="fOcc">${Object.entries(OCC).map(([k,l])=>`<button class="chipt" data-v="${k}" aria-pressed="${k==="soir"}">${l}</button>`).join("")}</div></div>
    <div class="field"><span class="flabel">Météo</span><div class="chips" id="fWx">${Object.entries(WX).map(([k,l])=>`<button class="chipt" data-v="${k}" aria-pressed="${k!=="chaud"}">${l}</button>`).join("")}</div></div>
    <p class="err" id="fErr"></p>
    <button class="btn full" id="savePerf">Ajouter à ma collection</button>
    <p class="foot">Il apparaîtra comme parfum à porter seul, et tu pourras l'utiliser dans tes propres combos. Pour des layerings experts, donne-moi son nom dans Claude.</p>`);
}
function savePerf(){
  const n=clean(document.getElementById("fN").value),h=clean(document.getElementById("fH").value);
  const fam=selv("fFam")[0]||"musc",pow=+(selv("fPow")[0]||3),occ=selv("fOcc"),wx=selv("fWx");
  const notes=clean(document.getElementById("fNotes").value).split(",").map(s=>s.trim()).filter(Boolean).slice(0,12);
  if(!n){ferr("Donne un nom au parfum.");return;}
  if(!occ.length||!wx.length){ferr("Choisis au moins une occasion et une météo.");return;}
  if(Object.keys(P).some(k=>isActive(k)&&P[k].n.toLowerCase()===n.toLowerCase())){ferr("Ce parfum est déjà dans ta collection.");return;}
  const k="u"+Date.now().toString(36),f=FAM[fam];
  S.custom.perfumes[k]={n,h:h||"Ma collection",fam:f.l,pow,v:false,m:f.m,c:f.c,notes:notes.length?notes:["notes à compléter"],brings:"Ajouté par toi. Demande-moi ses meilleurs layerings dans Claude.",custom:true};
  S.custom.combos.push({id:"us"+k,a:k,kind:"solo",custom:true,dose:pow>=4?"<b>1</b> spray, torse":"<b>2</b> sprays, cou et torse",ch:[f.l.split(",")[0].toLowerCase()],why:"Ajouté par toi.",res:notes.length?notes.slice(0,3).join(", "):f.l,occ,wx});
  save();applyChange();openPerf(k);
}
const ZL={cou:"au cou",torse:"au torse",vet:"sur les vêtements"};
function openAddCombo(){
  const keys=Object.keys(P).filter(isActive).sort((a,b)=>P[a].n.localeCompare(P[b].n,"fr"));
  const opts=sel=>keys.map(k=>`<option value="${k}" ${k===sel?"selected":""}>${P[k].n}</option>`).join("");
  const part=(i,def)=>`<div class="field"><label for="f${i}">Parfum ${i==="A"?1:2}</label><select id="f${i}" class="inp">${opts(def)}</select>
    <div class="duo"><div class="seg pick1" id="fD${i}"><button data-v="1" aria-pressed="true">1 spray</button><button data-v="2" aria-pressed="false">2</button></div>
    <div class="seg pick1" id="fZ${i}"><button data-v="cou" aria-pressed="${i==="A"}">Cou</button><button data-v="torse" aria-pressed="${i==="B"}">Torse</button><button data-v="vet" aria-pressed="false">Habits</button></div></div></div>`;
  openSheet(`<h3 class="ftitle">Créer mon combo</h3>${part("A",keys[0])}${part("B",keys[1])}
    <div class="risk" id="fWarn" hidden></div>
    <div class="field"><span class="flabel">Quand le porter</span><div class="chips" id="fOcc">${Object.entries(OCC).map(([k,l])=>`<button class="chipt" data-v="${k}" aria-pressed="${k==="soir"}">${l}</button>`).join("")}</div></div>
    <div class="field"><span class="flabel">Météo</span><div class="chips" id="fWx">${Object.entries(WX).map(([k,l])=>`<button class="chipt" data-v="${k}" aria-pressed="${k!=="chaud"}">${l}</button>`).join("")}</div></div>
    <div class="field"><label for="fNote">Ton ressenti (facultatif)</label><input id="fNote" class="inp" maxlength="120" placeholder="ex : boisé et doux, parfait le soir" autocomplete="off"></div>
    <p class="err" id="fErr"></p>
    <button class="btn full" id="saveCombo">Créer le combo</button>
    <p class="foot">Teste d'abord 1 spray de chaque sur deux zones différentes avant de l'adopter.</p>`);
  const chk=()=>{const a=document.getElementById("fA").value,b=document.getElementById("fB").value,w=document.getElementById("fWarn");const av=BASE_AVOID.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));w.hidden=!av;if(av)w.innerHTML=`<span class="k">${av.subj?"Question de goût":"Association à risque"}</span>${av.why}`;};
  document.getElementById("fA").onchange=chk;document.getElementById("fB").onchange=chk;chk();
}
function saveCombo(){
  const a=document.getElementById("fA").value,b=document.getElementById("fB").value;
  if(a===b){ferr("Choisis deux parfums différents.");return;}
  const occ=selv("fOcc"),wx=selv("fWx");if(!occ.length||!wx.length){ferr("Choisis au moins une occasion et une météo.");return;}
  const da=selv("fDA")[0]||"1",db=selv("fDB")[0]||"1",za=selv("fZA")[0]||"cou",zb=selv("fZB")[0]||"torse";
  const av=BASE_AVOID.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));const note=clean(document.getElementById("fNote").value);
  const fw=f=>f.split(/[ ,]/)[0].toLowerCase();
  const id="uc"+Date.now().toString(36);
  S.custom.combos.push({id,a,b,kind:"layer",custom:true,dose:`<b>${da}</b> ${P[a].n} ${ZL[za]} · <b>${db}</b> ${P[b].n} ${ZL[zb]}`,ch:[...new Set([fw(P[a].fam),fw(P[b].fam)])],why:note||"Ta propre association.",res:`${P[a].fam} et ${P[b].fam.toLowerCase()}.`,risk:av?av.why:"",occ,wx});
  save();applyChange();openCombo(id);
}
function backupCopy(){
  const txt=JSON.stringify({v:1,custom:S.custom,removed:S.removed,fav:S.fav,worn:S.worn,occ:S.occ,wx:S.wx});
  const ta=document.getElementById("bkText"),msg=document.getElementById("bkMsg");ta.value=txt;
  const fallback=()=>{ta.focus();ta.select();msg.textContent="Sauvegarde affichée : sélectionne le texte et copie-le.";};
  try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent="Sauvegarde copiée. Garde-la dans tes Notes.";},fallback);}catch(e){fallback();}
}
function backupImport(){
  const ta=document.getElementById("bkText"),msg=document.getElementById("bkMsg");
  try{const d=JSON.parse(ta.value);if(!d||typeof d!=="object"||!d.custom)throw 0;
    S.custom={perfumes:d.custom.perfumes||{},combos:d.custom.combos||[]};S.removed=d.removed||[];S.fav=d.fav||[];S.worn=d.worn||[];if(Array.isArray(d.occ)&&d.occ.length===7)S.occ=d.occ;if(d.wx)S.wx=d.wx;
    save();applyChange();const m=document.getElementById("bkMsg");if(m)m.textContent="Sauvegarde importée.";
  }catch(e){msg.textContent="Ce texte n'est pas une sauvegarde Sillages. Copie-la à nouveau depuis l'autre version.";}
}

/* ===== titre repliable ===== */
const navbar=document.getElementById("navbar");let io=null;
function observeTitle(){
  if(!("IntersectionObserver" in window))return;
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.closest(".view");if(v.hidden)return;navbar.textContent=e.target.dataset.title;navbar.classList.toggle("on",!e.isIntersecting&&e.boundingClientRect.top<0);}),{rootMargin:"-50px 0px 0px 0px"});
  document.querySelectorAll(".large").forEach(t=>io.observe(t));
}

/* ===== onglets & événements ===== */
function showTab(t){
  S.tab=t;save();navbar.classList.remove("on");
  document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  ["semaine","combos","parfums","eviter"].forEach(v=>document.getElementById("v-"+v).hidden=v!==t);
  window.scrollTo(0,0);observeTitle();
}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#xclose")){closeSheet();return;}
  if(t.closest("#sprayBtn"))return;
  const pk=t.closest("[data-pick]");if(pk){openPicker(+pk.dataset.pick);return;}
  const chz=t.closest("[data-choose]");if(chz){choose(chz.dataset.choose);return;}
  const opt=t.closest("[data-v]");if(opt){const g=opt.parentElement;if(g.classList.contains("pick1"))g.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b===opt));else opt.setAttribute("aria-pressed",opt.getAttribute("aria-pressed")!=="true");return;}
  if(t.closest("#addPerf")){openAddPerf();return;}
  if(t.closest("#savePerf")){savePerf();return;}
  if(t.closest("#addCombo")){openAddCombo();return;}
  if(t.closest("#saveCombo")){saveCombo();return;}
  if(t.closest("#bkCopy")){backupCopy();return;}
  if(t.closest("#bkImport")){backupImport();return;}
  const arm=t.closest("[data-remove],[data-delete],[data-delcombo]");
  if(arm&&!arm.dataset.armed){arm.dataset.armed="1";arm.textContent="Touche encore pour confirmer";return;}
  const rm=t.closest("[data-remove]");if(rm){const k=rm.dataset.remove;if(!S.removed.includes(k))S.removed.push(k);save();applyChange();openPerf(k);return;}
  const rs=t.closest("[data-restore]");if(rs){const k=rs.dataset.restore;S.removed=S.removed.filter(x=>x!==k);save();applyChange();openPerf(k);return;}
  const dl=t.closest("[data-delete]");if(dl){const k=dl.dataset.delete;delete S.custom.perfumes[k];S.custom.combos=S.custom.combos.filter(c=>c.a!==k&&c.b!==k);S.removed=S.removed.filter(x=>x!==k);delete P[k];save();applyChange();closeSheet();return;}
  const dc=t.closest("[data-delcombo]");if(dc){const id=dc.dataset.delcombo;S.custom.combos=S.custom.combos.filter(c=>c.id!==id);S.fav=S.fav.filter(x=>x!==id);save();applyChange();closeSheet();return;}
  if(t.closest("#wornBtn")){const c=byId(S.picks[todayIdx()]);if(c){toggleWorn(c.id);renderWeek();renderCombosBodySafe();}return;}
  const fv=t.closest("[data-fav]");if(fv){const id=fv.dataset.fav;const i=S.fav.indexOf(id);i>=0?S.fav.splice(i,1):S.fav.unshift(id);save();fv.classList.toggle("fav-on",i<0);fv.innerHTML=HEART(i<0);fv.setAttribute("aria-label",i<0?"Retirer des favoris":"Ajouter aux favoris");renderCombosBodySafe();return;}
  const wr=t.closest("[data-wear]");if(wr){const id=wr.dataset.wear;toggleWorn(id);wr.textContent=isWornToday(id)?"Porté aujourd'hui ✓":"Je le porte aujourd'hui";renderWeek();renderCombosBodySafe();return;}
  const d=t.closest("[data-day]");if(d){openDay(+d.dataset.day);return;}
  const cb=t.closest("[data-combo]");if(cb){openCombo(cb.dataset.combo);return;}
  const pf=t.closest("[data-perf]");if(pf){openPerf(pf.dataset.perf);return;}
  const w=t.closest("[data-wx]");if(w){S.wx=w.dataset.wx;generate();return;}
  if(t.closest("#regen")){generate();return;}
  const ch=t.closest("[data-change]");if(ch){const i=+ch.dataset.change;change(i);openDay(i);return;}
  const oc=t.closest("[data-occ]");if(oc){const i=+oc.closest("#occSeg").dataset.i;S.occ[i]=oc.dataset.occ;const used=new Set(S.picks.filter((_,j)=>j!==i));S.picks[i]=pickFor(i,used);save();renderWeek();openDay(i);return;}
});
function renderCombosBodySafe(){if(document.getElementById("cbody"))renderCombosBody();}

/* ===== logo : erlenmeyer de labo ===== */
function drawFlask(x,s){
  const g=x.createLinearGradient(0,0,s,s);g.addColorStop(0,"#2A1A12");g.addColorStop(1,"#0E0A08");
  x.fillStyle=g;x.fillRect(0,0,s,s);
  const u=s/100;x.lineJoin="round";x.lineCap="round";
  const flask=()=>{x.beginPath();x.moveTo(40*u,18*u);x.lineTo(40*u,40*u);x.lineTo(20*u,76*u);x.quadraticCurveTo(16*u,84*u,25*u,84*u);x.lineTo(75*u,84*u);x.quadraticCurveTo(84*u,84*u,80*u,76*u);x.lineTo(60*u,40*u);x.lineTo(60*u,18*u);};
  x.save();flask();x.clip();
  const lq=x.createLinearGradient(0,52*u,0,84*u);lq.addColorStop(0,"#F3C26B");lq.addColorStop(1,"#B5651D");
  x.fillStyle=lq;x.beginPath();x.moveTo(0,56*u);x.quadraticCurveTo(25*u,52*u,50*u,56*u);x.quadraticCurveTo(75*u,60*u,100*u,55*u);x.lineTo(100*u,100*u);x.lineTo(0,100*u);x.fill();
  x.fillStyle="rgba(255,255,255,.55)";[[42,72,3.2],[55,66,2.2],[48,62,1.6],[60,76,2.6]].forEach(([a,b,r])=>{x.beginPath();x.arc(a*u,b*u,r*u,0,7);x.fill();});
  x.restore();
  flask();x.strokeStyle="rgba(255,255,255,.92)";x.lineWidth=4*u;x.stroke();
  x.beginPath();x.moveTo(35*u,18*u);x.lineTo(65*u,18*u);x.stroke();
  x.fillStyle="rgba(243,194,107,.85)";[[46,10,2.4],[54,5,1.6],[58,12,1.3]].forEach(([a,b,r])=>{x.beginPath();x.arc(a*u,b*u,r*u,0,7);x.fill();});
}
const LOGO=(()=>{try{const cv=document.createElement("canvas");cv.width=cv.height=120;drawFlask(cv.getContext("2d"),120);return `<img src="${cv.toDataURL("image/png")}" alt="" width="30" height="30">`;}catch(e){return "";}})();
try{
  const cv=document.createElement("canvas");cv.width=cv.height=180;drawFlask(cv.getContext("2d"),180);
  const url=cv.toDataURL("image/png");
  [["apple-touch-icon"],["icon"]].forEach(([rel])=>{const l=document.createElement("link");l.rel=rel;l.href=url;l.sizes="180x180";document.head.appendChild(l);});
}catch(e){}

/* ===== démarrage ===== */
if(!S.picks||S.picks.length!==7) generate(); else refreshPicks();
renderWeek();renderCombos();renderPerfumes();renderAvoid();
showTab(S.tab||"semaine");
</script>
